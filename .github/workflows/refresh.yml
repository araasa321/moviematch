name: weekly-refresh

# Popularity sweep across the whole catalog + vote/bayes recompute. Slow by
# nature, so it runs once a week rather than nightly (GitHub cron: 0 = Sunday).
on:
  schedule: [{cron: "15 9 * * 0"}]   # Sundays 09:15 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - run: pip install -r jobs/requirements.txt
      - name: weekly refresh
        run: python jobs/sync_tmdb.py --mode refresh --stats-out refresh-stats.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-stats
          path: refresh-stats.json
          if-no-files-found: ignore
