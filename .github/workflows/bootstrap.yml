name: bootstrap

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after N upserted points (leave empty for the full run)"
        required: false
        default: ""
      types:
        description: "movie, series, or both"
        required: false
        default: "movie series"
      langs:
        description: "ISO-639-1 codes to crawl, space separated (e.g. 'en ja ko'). 'en' only = English-only catalog."
        required: false
        default: "en"
      rate:
        description: "TMDB requests/second (ceiling is ~40; leave at 30 for headroom)"
        required: false
        default: "30"
      concurrency:
        description: "in-flight TMDB requests (the pacer still caps the rate)"
        required: false
        default: "16"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - run: pip install -r jobs/requirements.txt
      - name: bootstrap
        run: |
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then LIMIT_ARG="--limit ${{ inputs.limit }}"; fi
          LANGS="${{ inputs.langs }}"
          if [ -z "$LANGS" ]; then LANGS="en"; fi
          RATE="${{ inputs.rate }}"
          if [ -z "$RATE" ]; then RATE="30"; fi
          CONCURRENCY="${{ inputs.concurrency }}"
          if [ -z "$CONCURRENCY" ]; then CONCURRENCY="16"; fi
          echo "crawling langs=[$LANGS] rate=${RATE}/s concurrency=$CONCURRENCY"
          python jobs/sync_tmdb.py --mode bootstrap \
            --types ${{ inputs.types }} \
            --langs $LANGS \
            --rate "$RATE" \
            --concurrency "$CONCURRENCY" \
            $LIMIT_ARG \
            --stats-out bootstrap-stats.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-stats
          path: bootstrap-stats.json
          if-no-files-found: ignore
