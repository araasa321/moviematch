name: daily-sync

# Adds new titles and catches same-week releases. Deliberately small: the heavy
# popularity sweep and vote/bayes recompute live in refresh.yml (Sundays) because
# on a ~43k-point catalog they cannot finish inside a practical timeout.
on:
  schedule: [{cron: "15 9 * * *"}]   # after TMDB's ~08:00 UTC export (PLAN §6.4)
  workflow_dispatch:
    inputs:
      recent_days:
        description: "Also pick up titles released in the last N days (0 disables)"
        required: false
        default: "3"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - run: pip install -r jobs/requirements.txt
      - name: daily sync
        run: |
          DAYS="${{ inputs.recent_days }}"
          if [ -z "$DAYS" ]; then DAYS="3"; fi
          python jobs/sync_tmdb.py --mode daily --recent-days "$DAYS" \
            --stats-out sync-stats.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-stats
          path: sync-stats.json
          if-no-files-found: ignore
