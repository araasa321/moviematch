name: backfill-bayes

# Full-catalog bayes/bayes_gems recompute (#4b).
#
# Why this exists: refresh.yml only recomputes bayes for `active_sample` — 25
# discover pages sorted by popularity, ~1,000 titles. On a 45k catalog that is
# ~2 % of the points, so after deploying #4b most titles keep their OLD
# single-mean bayes and the stratified prior barely reaches serving.
# (Observed live: "vote/bayes refresh applied to 915 points" out of 45,177.)
#
# Safe: payload-only, no embeddings, no vector writes. Writes go through
# set_payload_batch, whose set_payload operations MERGE keys, so no other field
# can be replaced. Idempotent — a second run updates 0 points.
#
# Run this ONCE after deploying a change to jobs/policy.bayes_stats, and after
# any bootstrap that predates #4b.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and report only; write nothing"
        type: boolean
        default: false
      limit:
        description: "Only the first N points (blank = whole catalog)"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r jobs/requirements.txt
      - name: backfill bayes
        env:
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_LIMIT: ${{ inputs.limit }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${IN_DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "${IN_LIMIT:-}" ]; then ARGS+=(--limit "$IN_LIMIT"); fi
          echo "python jobs/backfill_bayes.py ${ARGS[*]:-}"
          # `"${ARGS[@]}"` with an empty array expands to ZERO words under
          # `set -u` on bash >= 4.4, which is what we want here. Do not write
          # `"${ARGS[@]:-}"`: that passes one empty STRING argument instead.
          python jobs/backfill_bayes.py "${ARGS[@]}"
